<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reference Searching — YouTube Shorts 쇼핑 트렌드</title>
  <meta name="description" content="구글 트렌드 기반 YouTube Shorts 쇼핑 정보 수집 결과" />
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #111;
      --panel-2: #1a1a1a;
      --fg: #fafafa;
      --muted: #999;
      --border: #2a2a2a;
      --accent: #ff0033;
      --accent-dim: #cc0029;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo",
                   "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      line-height: 1.5;
    }
    a { color: inherit; }
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }

    header { margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; }
    header h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.35rem; }
    header h1 .accent { color: var(--accent); }
    header p { color: var(--muted); font-size: 0.875rem; }

    .controls {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .controls input, .controls select {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 0.6rem 0.85rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .controls input { flex: 1; min-width: 220px; }
    .controls input:focus, .controls select:focus { outline: none; border-color: var(--accent); }

    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s ease;
    }
    .card:hover { border-color: var(--accent); }
    .card-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.4rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      display: flex;
      gap: 0.85rem;
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-block;
      background: var(--panel-2);
      color: var(--muted);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      margin-bottom: 0.5rem;
    }

    .products { margin-top: 0.5rem; flex: 1; }
    .product {
      padding: 0.7rem 0.8rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-top: 0.5rem;
    }
    .product-name {
      font-size: 0.85rem;
      margin-bottom: 0.3rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .product-info { color: var(--muted); font-size: 0.78rem; }
    .product-info .price { color: var(--accent); font-weight: 700; }

    .card-actions { display: flex; gap: 0.5rem; margin-top: 0.85rem; }
    .btn {
      flex: 1;
      text-align: center;
      padding: 0.55rem 0.5rem;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      transition: background 0.15s ease;
    }
    .btn-video { background: var(--panel-2); color: var(--fg); border: 1px solid var(--border); }
    .btn-video:hover { background: #252525; }
    .btn-buy { background: var(--accent); color: white; }
    .btn-buy:hover { background: var(--accent-dim); }

    .empty {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }
    .empty h2 { color: var(--fg); margin-bottom: 0.5rem; font-size: 1.1rem; }
    .empty code {
      background: var(--panel-2);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.85em;
    }

    footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }
    footer a { color: var(--muted); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>YouTube Shorts <span class="accent">쇼핑 트렌드</span></h1>
      <p id="meta">로드 중…</p>
    </header>

    <div class="controls">
      <input id="search" type="search" placeholder="상품명 / 판매처 / 키워드 / 채널 검색" />
      <select id="sort">
        <option value="views">조회수↓</option>
        <option value="views-asc">조회수↑</option>
        <option value="recent">최신순</option>
      </select>
    </div>

    <div id="results"></div>

    <footer>
      <p>구글 트렌드 기반 키워드 → YouTube Data API 검색 → 쇼핑 스티커 추출 결과</p>
      <p style="margin-top:0.4rem;">소스: <a href="https://github.com/ysm9942/Reference-Searching" target="_blank">github.com/ysm9942/Reference-Searching</a></p>
    </footer>
  </div>

  <script>
    let allItems = [];

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function formatViews(n) {
      n = Number(n) || 0;
      if (n >= 1e8) return (n / 1e8).toFixed(1).replace(/\.0$/, "") + "억";
      if (n >= 1e4) return Math.round(n / 1e4) + "만";
      return n.toLocaleString("ko-KR");
    }

    function relativeDate(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";
      const days = Math.floor((Date.now() - d.getTime()) / 86400000);
      if (days < 1) return "오늘";
      if (days < 7) return days + "일 전";
      if (days < 30) return Math.floor(days / 7) + "주 전";
      if (days < 365) return Math.floor(days / 30) + "개월 전";
      return Math.floor(days / 365) + "년 전";
    }

    function renderCards(items) {
      const container = document.getElementById("results");
      if (items.length === 0) {
        container.innerHTML =
          '<div class="empty"><h2>표시할 항목이 없습니다</h2>' +
          '<p>아직 파이프라인이 한 번도 실행되지 않았거나, 검색어와 일치하는 항목이 없습니다.</p>' +
          '<p style="margin-top:0.8rem">로컬에서 실행 후 푸시하세요: <code>python pipeline.py</code></p></div>';
        return;
      }
      container.innerHTML =
        '<div class="grid">' +
        items.map(function (item) {
          const products = item.products || [];
          const firstBuyLink = products[0] && products[0].link;
          return [
            '<article class="card">',
            item.matched_keyword ? '<span class="badge">' + escapeHtml(item.matched_keyword) + '</span>' : "",
            '<div class="card-title">' + escapeHtml(item.title || "제목 없음") + '</div>',
            '<div class="card-meta">',
              '<span>조회 ' + formatViews(item.view_count) + '</span>',
              item.channel ? '<span>' + escapeHtml(item.channel) + '</span>' : "",
              item.published_at ? '<span>' + relativeDate(item.published_at) + '</span>' : "",
            '</div>',
            '<div class="products">',
              products.map(function (p) {
                return [
                  '<div class="product">',
                    '<div class="product-name">' + escapeHtml(p.name || "상품명 없음") + '</div>',
                    '<div class="product-info">',
                      '<span class="price">' + escapeHtml(p.price || "-") + '</span>',
                      p.seller ? ' · ' + escapeHtml(p.seller) : "",
                    '</div>',
                  '</div>',
                ].join("");
              }).join(""),
            '</div>',
            '<div class="card-actions">',
              '<a class="btn btn-video" href="' + escapeHtml(item.video_url) + '" target="_blank" rel="noopener">쇼츠 보기</a>',
              firstBuyLink
                ? '<a class="btn btn-buy" href="' + escapeHtml(firstBuyLink) + '" target="_blank" rel="noopener">구매하기</a>'
                : "",
            '</div>',
            '</article>',
          ].join("");
        }).join("") +
        '</div>';
    }

    function apply() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const sort = document.getElementById("sort").value;
      let items = allItems.slice();
      if (q) {
        items = items.filter(function (it) {
          const hay = [
            it.title, it.channel, it.matched_keyword,
            ...(it.products || []).flatMap(function (p) { return [p.name, p.seller]; }),
          ].filter(Boolean).join(" ").toLowerCase();
          return hay.indexOf(q) !== -1;
        });
      }
      if (sort === "views") items.sort(function (a, b) { return (b.view_count || 0) - (a.view_count || 0); });
      if (sort === "views-asc") items.sort(function (a, b) { return (a.view_count || 0) - (b.view_count || 0); });
      if (sort === "recent") items.sort(function (a, b) {
        return new Date(b.published_at || 0) - new Date(a.published_at || 0);
      });
      renderCards(items);
    }

    fetch("./results.json")
      .then(function (r) {
        if (!r.ok) throw new Error("status " + r.status);
        return r.json();
      })
      .then(function (data) {
        allItems = data.items || [];
        const meta = document.getElementById("meta");
        const dt = data.generated_at ? new Date(data.generated_at) : null;
        const dtStr = dt && !Number.isNaN(dt.getTime()) ? dt.toLocaleString("ko-KR") : "알 수 없음";
        meta.textContent = allItems.length + "개 항목 · 마지막 갱신: " + dtStr;
        apply();
      })
      .catch(function (err) {
        console.error(err);
        document.getElementById("meta").textContent = "results.json 로드 실패";
        document.getElementById("results").innerHTML =
          '<div class="empty"><h2>결과 파일을 찾을 수 없습니다</h2>' +
          '<p>로컬에서 파이프라인을 실행하고 <code>web/results.json</code> 을 푸시해주세요.</p></div>';
      });

    document.getElementById("search").addEventListener("input", apply);
    document.getElementById("sort").addEventListener("change", apply);
  </script>
</body>
</html>
